<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>🎂小琪 2026 生日 - 薩摩耶覓食地圖☃️📍</title>

  <style>
    :root {
      --panel: rgba(255,255,255,.97);
      --text: #171717;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --sheet-height: 36vh;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang HK", "Noto Sans HK", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: #f3f4f6;
    }

    #map-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: var(--sheet-height);
  z-index: 1;
  background: #e5e7eb;
}

#map {
  width: 100%;
  height: 100%;
}

    .topbar {
      position: fixed;
      z-index: 1000;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      pointer-events: none;
    }

    .top-card {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
      padding: 10px;
      backdrop-filter: blur(12px);
    }

    .title-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 10px;
  margin-bottom: 9px;
}

.title {
  min-width: 0;
}

.title-main {
  font-size: 17px;
  font-weight: 850;
  line-height: 1.25;
  white-space: nowrap;
}

.title-sub {
  margin-top: 2px;
  font-size: 13px;
  font-weight: 750;
  line-height: 1.25;
  color: var(--muted);
  white-space: nowrap;
}

.location-status {
  max-width: 120px;
  padding-top: 2px;
  color: var(--muted);
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.category-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
}

.category-row .chips {
  flex: 1 1 auto;
  min-width: 0;
}

.category-toggle-button {
  flex: 0 0 42px;
  width: 42px;
  height: 40px;

  display: grid;
  place-items: center;

  border: 1px solid var(--border);
  border-radius: 999px;

  background: #fff;
  color: #111827;

  padding: 0;
  cursor: pointer;

  box-shadow: none;

  transition:
    transform 180ms ease,
    background 180ms ease;
}

    .category-toggle-button::before {
  content: "";

  width: 11px;
  height: 11px;

  border-right: 3px solid #111827;
  border-bottom: 3px solid #111827;

  transform:
    translateY(-3px)
    rotate(45deg);

  transition: transform 180ms ease;
}

    .category-row.expanded .category-toggle-button::before {
  transform:
    translateY(3px)
    rotate(225deg);
}

.category-toggle-button:active {
  transform: scale(.94);
}

/* 展開後：所有 category 自動換行 */
.category-row.expanded .chips {
  flex-wrap: wrap;
  overflow-x: visible;
  white-space: normal;
}
    
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: #222;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .locate-button {
      position: fixed;
      z-index: 900;
      right: 14px;
      bottom: calc(var(--sheet-height) + 14px);
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 5px 18px rgba(0,0,0,.2);
      font-size: 22px;
      cursor: pointer;
    }
    .expand-map-button {
  position: fixed;
  z-index: 900;

  right: 70px;
  bottom: calc(var(--sheet-height) + 14px);

  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  border: 0;
  border-radius: 50%;
  background: #fff;

  color: #111827;
  font-size: 22px;
  font-weight: 700;

  box-shadow: 0 5px 18px rgba(0,0,0,.2);

  cursor: pointer;

  transition:
    bottom 220ms cubic-bezier(.2,.8,.2,1),
    transform 120ms ease;
}

.expand-map-button:active {
  transform: scale(.94);
}
    
    .sheet {
      position: fixed;
      z-index: 800;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--sheet-height);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border-top: 1px solid rgba(0,0,0,.08);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 28px rgba(0,0,0,.12);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      transition: height 220ms cubic-bezier(.2,.8,.2,1);
    }

    .grabber {
  position: relative;
  width: 100%;
  height: 28px;
  flex: 0 0 28px;
  margin: -5px 0 2px;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.grabber::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 50%;
  width: 38px;
  height: 5px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: #d1d5db;
}
    #map-container {
  transition: bottom 220ms cubic-bezier(.2,.8,.2,1);
}

.locate-button {
  transition: bottom 220ms cubic-bezier(.2,.8,.2,1);
}

body.sheet-dragging .sheet,
body.sheet-dragging #map-container,
body.sheet-dragging .locate-button,
body.sheet-dragging .expand-map-button {
  transition: none;
}
    
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
      margin-bottom: 7px;
    }

    .sheet-title { font-size: 16px; font-weight: 850; }

    .sheet-hint {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    #results {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 28px;
    }

    .place-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 11px 4px;
      border-top: 1px solid var(--border);
    }

    .place-card:first-child { border-top: 0; }

    .place-name {
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .place-address {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .place-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .distance {
      color: #111;
      font-weight: 850;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-btn, .maps-btn {
      display: block;
      min-width: 76px;
      text-align: center;
      text-decoration: none;
      border-radius: 11px;
      padding: 8px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav-btn { background: #111827; color: #fff; }

    .maps-btn {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .loading-note, .setup-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 4px 9px;
    }

    .setup-note strong { color: #111; }

    .error-card {
      position: fixed;
      z-index: 2000;
      left: 14px;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 520px;
      margin: auto;
      padding: 18px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      font-size: 14px;
      line-height: 1.55;
    }

    .error-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .footer-links {
      padding: 8px 4px 14px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .footer-links a { color: inherit; }

    @media (min-width: 760px) {
      :root { --sheet-height: 32vh; }

      .topbar {
        left: 50%;
        right: auto;
        width: min(720px, calc(100% - 24px));
        transform: translateX(-50%);
      }

      .sheet {
        left: 50%;
        width: min(720px, 100%);
        transform: translateX(-50%);
      }
    }
  </style>
</head>

</div>

  <div class="topbar">
    <div class="top-card">
      <div class="title-row">
  <div class="title">

  <script>
    const MACAU_CENTER = { lat: 22.1987, lng: 113.5439 };

    let map;
    let geocoder;
    let infoWindow;
    let activeCategory = "全部";
let restaurantMarkers = [];
let restaurantClusterer = null;
    
    let userPosition = null;
    let userMarker = null;
    let accuracyCircle = null;
    let hasCenteredOnUser = false;
    let geocodingDone = false;
    let geocodingCount = 0;

    const chipsEl = document.getElementById("chips");
    
    const categoryRowEl = document.getElementById("categoryRow");
const categoryToggleButtonEl = document.getElementById("categoryToggleButton");
    
    const resultsEl = document.getElementById("results");
    const sheetTitleEl = document.getElementById("sheetTitle");
    const sheetHintEl = document.getElementById("sheetHint");
    const locationStatusEl = document.getElementById("locationStatus");
    const locateButtonEl = document.getElementById("locateButton");
    const expandMapButtonEl = document.getElementById("expandMapButton");
    
const sheetEl = document.querySelector(".sheet");
const sheetGrabberEl = document.getElementById("sheetGrabber");

let toggleBottomSheet = () => {};
    
function setupBottomSheet() {
  let sheetMinHeight = 150;
  let sheetMaxHeight = 0;
  let sheetCurrentHeight = 0;
  let sheetExpanded = true;

  let dragState = null;

  function calculateBounds() {
    const viewportHeight = window.innerHeight;

    // 拉低後約 150px；細機稍為再縮少少。
    sheetMinHeight = Math.max(
      140,
      Math.min(160, Math.round(viewportHeight * 0.18))
    );

    // 最高保持你目前嘅高度：
    // 手機 36vh、desktop 32vh。
const maxRatio = window.innerWidth >= 760 ? 0.45 : 0.60;
    
    sheetMaxHeight = Math.max(
      235,
      Math.round(viewportHeight * maxRatio)
    );
  }

  function setSheetHeight(height) {
    sheetCurrentHeight = Math.max(
      sheetMinHeight,
      Math.min(sheetMaxHeight, height)
    );

    document.documentElement.style.setProperty(
      "--sheet-height",
      `${sheetCurrentHeight}px`
    );
  }

  function snapSheet(expanded) {
  sheetExpanded = expanded;

  document.body.classList.remove("sheet-dragging");

  setSheetHeight(
    sheetExpanded
      ? sheetMaxHeight
      : sheetMinHeight
  );

  // Sheet 改變後俾 Google Maps 重新確認尺寸。
  setTimeout(() => {
    if (!map || typeof google === "undefined") return;

    const center = map.getCenter();

    google.maps.event.trigger(map, "resize");

    if (center) {
      map.setCenter(center);
    }
  }, 230);
}

function updateSheetToggleButton() {
  if (!expandMapButtonEl) return;

  if (sheetExpanded) {
    // Sheet 高：下一個動作係放大地圖
    expandMapButtonEl.textContent = "🗾";
    expandMapButtonEl.setAttribute(
      "aria-label",
      "放大地圖"
    );
    expandMapButtonEl.title = "放大地圖";
  } else {
    // Sheet 低：下一個動作係展開餐廳列表
    expandMapButtonEl.textContent = "📋";
    expandMapButtonEl.setAttribute(
      "aria-label",
      "展開餐廳列表"
    );
    expandMapButtonEl.title = "展開餐廳列表";
  }
}


function snapSheet(expanded) {
  sheetExpanded = expanded;

  document.body.classList.remove("sheet-dragging");

  setSheetHeight(
    sheetExpanded
      ? sheetMaxHeight
      : sheetMinHeight
  );

  // 更新右下角 toggle icon
  updateSheetToggleButton();

  // Sheet 改變後俾 Google Maps 重新確認尺寸。
  setTimeout(() => {
    if (!map || typeof google === "undefined") return;

    const center = map.getCenter();

    google.maps.event.trigger(map, "resize");

    if (center) {
      map.setCenter(center);
    }
  }, 230);
}


toggleBottomSheet = () => {
  snapSheet(!sheetExpanded);
};
  
  calculateBounds();
  setSheetHeight(sheetMaxHeight);
  updateSheetToggleButton();

  sheetGrabberEl.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;

    event.preventDefault();

    dragState = {
      pointerId: event.pointerId,
      startY: event.clientY,
      startHeight: sheetCurrentHeight,
      moved: false
    };

    document.body.classList.add("sheet-dragging");

    try {
      sheetGrabberEl.setPointerCapture(event.pointerId);
    } catch {}
  });

  sheetGrabberEl.addEventListener("pointermove", event => {
    if (
      !dragState ||
      event.pointerId !== dragState.pointerId
    ) {
      return;
    }

    event.preventDefault();

    const movement =
      dragState.startY - event.clientY;

    if (Math.abs(movement) > 4) {
      dragState.moved = true;
    }

    setSheetHeight(
      dragState.startHeight + movement
    );
  });

  function finishDrag(event, cancelled = false) {
    if (
      !dragState ||
      event.pointerId !== dragState.pointerId
    ) {
      return;
    }

    const moved = dragState.moved;

    dragState = null;

    try {
      sheetGrabberEl.releasePointerCapture(event.pointerId);
    } catch {}

    // 如果只係撳一下條 grabber，直接切換高／低。
    if (!cancelled && !moved) {
      snapSheet(!sheetExpanded);
      return;
    }

    // 拖完之後，自動吸去最近嘅位置。
    const midpoint =
      (sheetMinHeight + sheetMaxHeight) / 2;

    snapSheet(sheetCurrentHeight >= midpoint);
  }

  sheetGrabberEl.addEventListener(
    "pointerup",
    event => finishDrag(event)
  );

  sheetGrabberEl.addEventListener(
    "pointercancel",
    event => finishDrag(event, true)
  );

 // 旋轉手機時重新計算。
window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    calculateBounds();

    setSheetHeight(
      sheetExpanded
        ? sheetMaxHeight
        : sheetMinHeight
    );

    updateSheetToggleButton();
  }, 250);
});

window.addEventListener("resize", () => {
  calculateBounds();

  setSheetHeight(
    sheetExpanded
      ? sheetMaxHeight
      : sheetMinHeight
  );

  updateSheetToggleButton();
});
  
  }
    
    function setupOneHandZoom() {
  const mapContainer = document.getElementById("map-container");

  if (!mapContainer || !map) return;

  // 第二下 tap 要喺幾耐之內發生
  const DOUBLE_TAP_TIME = 360;

  // 第二下 tap 同第一下最多相距幾多 px
  const DOUBLE_TAP_DISTANCE = 42;

  // 第二下按住後，移動幾多 px 先正式當成 zoom
  const DRAG_THRESHOLD = 6;

  // 手指上下移動約 105px = 1 個 zoom level
  const PIXELS_PER_ZOOM = 140;

  let lastTap = null;
  let pointerState = null;
  let zoomGesture = null;

  let zoomFrame = null;
let targetZoom = null;
let renderedZoom = null;

const ZOOM_SMOOTHING = 0.22;
      
  // 用嚟避免同雙指 pinch zoom 打交
  const activeTouches = new Set();


  function distance(x1, y1, x2, y2) {
    return Math.hypot(
      x2 - x1,
      y2 - y1
    );
  }


  function getZoomLimits() {
    const configuredMin = Number(map.get("minZoom"));
    const configuredMax = Number(map.get("maxZoom"));

    return {
      min: Number.isFinite(configuredMin)
        ? configuredMin
        : 3,

      max: Number.isFinite(configuredMax)
        ? configuredMax
        : 21
    };
  }


  function clampZoom(zoom) {
    const limits = getZoomLimits();

    return Math.max(
      limits.min,
      Math.min(limits.max, zoom)
    );
  }


  function scheduleZoom(zoom) {
  targetZoom = clampZoom(zoom);

  if (renderedZoom === null) {
    renderedZoom = map.getZoom() ?? targetZoom;
  }

  if (zoomFrame !== null) {
    return;
  }

  function animateZoom() {
    if (
      !map ||
      targetZoom === null ||
      renderedZoom === null
    ) {
      zoomFrame = null;
      return;
    }

    const difference =
      targetZoom - renderedZoom;

    renderedZoom +=
      difference * ZOOM_SMOOTHING;

    if (Math.abs(difference) < 0.002) {
      renderedZoom = targetZoom;
    }

    map.moveCamera({
      zoom: renderedZoom
    });

    if (
      Math.abs(targetZoom - renderedZoom) >= 0.002
    ) {
      zoomFrame =
        requestAnimationFrame(animateZoom);
    } else {
      zoomFrame = null;
    }
  }

  zoomFrame =
    requestAnimationFrame(animateZoom);
}


  function restoreNormalMapGestures() {
    if (!map) return;

    map.setOptions({
      gestureHandling: "greedy"
    });
  }


  function cancelZoomGesture() {
    if (!zoomGesture) return;

    try {
      mapContainer.releasePointerCapture(
        zoomGesture.pointerId
      );
    } catch {}

    zoomGesture = null;

    if (zoomFrame !== null) {
      cancelAnimationFrame(zoomFrame);
      zoomFrame = null;
    }

targetZoom = null;
renderedZoom = null;
    
    restoreNormalMapGestures();
  }


  mapContainer.addEventListener(
    "pointerdown",
    event => {
      if (
        event.pointerType !== "touch" ||
        !map
      ) {
        return;
      }

      activeTouches.add(event.pointerId);

      /*
       * 如果有第二隻手指同時落地圖，
       * 代表用家可能想 pinch zoom。
       * 唔啟動單手 zoom。
       */
      if (activeTouches.size > 1) {
        lastTap = null;
        pointerState = null;

        cancelZoomGesture();

        return;
      }

      const now = performance.now();

      if (
        lastTap &&
        now - lastTap.time > DOUBLE_TAP_TIME
      ) {
        lastTap = null;
      }

      const isSecondTap =
        lastTap &&
        now - lastTap.time <= DOUBLE_TAP_TIME &&
        distance(
          lastTap.x,
          lastTap.y,
          event.clientX,
          event.clientY
        ) <= DOUBLE_TAP_DISTANCE;


      pointerState = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startTime: now,
        moved: false
      };


      // 普通第一下 tap
      if (!isSecondTap) {
        return;
      }


      /*
       * 第二下 tap 已經命中：
       * 開始準備單手 zoom。
       */
      lastTap = null;

      zoomGesture = {
        pointerId: event.pointerId,
        startY: event.clientY,
        startZoom: map.getZoom() ?? 14,
        moved: false
      };


      /*
       * 暫時停止 Google Maps 自己嘅 pan，
       * 否則向上下拖時地圖會同時移動。
       */
      map.setOptions({
        gestureHandling: "none"
      });


      try {
        mapContainer.setPointerCapture(
          event.pointerId
        );
      } catch {}


      event.preventDefault();
      event.stopPropagation();
    },
    {
      capture: true,
      passive: false
    }
  );


  mapContainer.addEventListener(
    "pointermove",
    event => {
      if (event.pointerType !== "touch") {
        return;
      }


      if (
        pointerState &&
        event.pointerId === pointerState.pointerId
      ) {
        const movedDistance = distance(
          pointerState.startX,
          pointerState.startY,
          event.clientX,
          event.clientY
        );

        if (movedDistance > 10) {
          pointerState.moved = true;
        }
      }


      if (
        !zoomGesture ||
        event.pointerId !== zoomGesture.pointerId
      ) {
        return;
      }


      /*
       * 有第二隻手指：
       * 放棄單手 zoom，交返俾原生 pinch。
       */
      if (activeTouches.size > 1) {
        cancelZoomGesture();
        return;
      }


      const deltaY =
        event.clientY - zoomGesture.startY;


      if (
        Math.abs(deltaY) >= DRAG_THRESHOLD
      ) {
        zoomGesture.moved = true;
      }


      if (!zoomGesture.moved) {
        return;
      }


      event.preventDefault();
      event.stopPropagation();


      /*
       * Google Maps App 式方向：
       *
       * 手指向下 ↓ = 放大
       * 手指向上 ↑ = 縮小
       */
      const nextZoom =
        zoomGesture.startZoom +
        deltaY / PIXELS_PER_ZOOM;


      scheduleZoom(nextZoom);
    },
    {
      capture: true,
      passive: false
    }
  );


  function finishPointer(event, cancelled = false) {
    activeTouches.delete(event.pointerId);


    /*
     * 正在做單手 zoom
     */
    if (
      zoomGesture &&
      event.pointerId === zoomGesture.pointerId
    ) {
      const startZoom = zoomGesture.startZoom;
      const moved = zoomGesture.moved;

      zoomGesture = null;
      pointerState = null;
      lastTap = null;


      if (zoomFrame !== null) {
        cancelAnimationFrame(zoomFrame);
        zoomFrame = null;
      }


      if (
  targetZoom !== null &&
  map
) {
  map.moveCamera({
    zoom: clampZoom(targetZoom)
  });
}

targetZoom = null;
renderedZoom = null;


      restoreNormalMapGestures();


      try {
        mapContainer.releasePointerCapture(
          event.pointerId
        );
      } catch {}


      /*
       * 如果係普通 double tap，
       * 第二下冇上下拖：
       *
       * 放大一級。
       */
      if (
        !cancelled &&
        !moved &&
        map
      ) {
map.moveCamera({
  zoom: clampZoom(startZoom + 1)
});
      }


      event.preventDefault();
      event.stopPropagation();

      return;
    }


    /*
     * 普通第一下 tap 完成：
     * 記錄佢，等第二下。
     */
    if (
      pointerState &&
      event.pointerId === pointerState.pointerId
    ) {
      const tapDuration =
        performance.now() -
        pointerState.startTime;


      if (
        !cancelled &&
        !pointerState.moved &&
        tapDuration < 300 &&
        activeTouches.size === 0
      ) {
        lastTap = {
          time: performance.now(),
          x: event.clientX,
          y: event.clientY
        };
      } else {
        lastTap = null;
      }


      pointerState = null;
    }
  }


  mapContainer.addEventListener(
    "pointerup",
    event => {
      finishPointer(event);
    },
    {
      capture: true,
      passive: false
    }
  );


  mapContainer.addEventListener(
    "pointercancel",
    event => {
      finishPointer(event, true);
    },
    {
      capture: true,
      passive: false
    }
  );
}
    function showFatal(message) {
      const card = document.createElement("div");
      card.className = "error-card";
      card.innerHTML = `<h2>地圖未能啟動</h2><div>${message}</div>`;
      document.body.appendChild(card);
    }

    function hasCoords(place) {
      return Number.isFinite(place.lat) && Number.isFinite(place.lng);
    }

    function categoryEmoji(category) {
      const found = restaurants.find(r => r.category === category);
      return found?.emoji || "🍴";
    }

    function uniqueCategories() {
      return [...new Set(restaurants.map(r => r.category).filter(Boolean))];
    }

    function makeChips() {
      const cats = ["全部", ...uniqueCategories()];
      chipsEl.innerHTML = "";

      cats.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "chip" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat === "全部"
          ? "🗺️ 全部"
          : `${categoryEmoji(cat)} ${cat}`;

        btn.addEventListener("click", () => {
          activeCategory = cat;
          makeChips();
          render();
          fitVisibleRestaurants();
        });

        chipsEl.appendChild(btn);
      });
    }

    function filteredRestaurants() {
      if (activeCategory === "全部") return [...restaurants];
      return restaurants.filter(r => r.category === activeCategory);
    }

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;

      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(meters) {
      if (meters == null) return "待定位";
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function directionsUrl(place) {
      if (!hasCoords(place)) return place.mapsUrl || "#";
      const dest = encodeURIComponent(`${place.lat},${place.lng}`);
      return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
    }

    function clearRestaurantMarkers() {
      if (restaurantClusterer) {
    restaurantClusterer.clearMarkers();
    restaurantClusterer.setMap(null);
    restaurantClusterer = null;
  }

  restaurantMarkers.forEach(marker => {
    marker.setMap(null);
  });

  restaurantMarkers = [];
}

function renderMarkers(items) {
  if (!map) return;

  clearRestaurantMarkers();


  // =========================================================
  // 1. 先建立所有餐廳 markers
  // =========================================================

  items.filter(hasCoords).forEach(place => {

    const marker = new google.maps.Marker({
      // 注意：呢度唔好寫 map: map
      // 由 MarkerClusterer 決定 marker 幾時顯示。

      position: {
        lat: place.lat,
        lng: place.lng
      },

      title: place.name,

      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 18,

        fillColor: "#e3c5f2",
        fillOpacity: 0.98,

        strokeColor: "#ce85f2",
        strokeOpacity: 1,
        strokeWeight: 2
      },

      label: {
        text: place.emoji || "🍴",
        fontSize: "18px"
      },

      zIndex: 10
    });


    // ---------------------------------------------------------
    // 撳餐廳 marker
    // ---------------------------------------------------------

    marker.addListener("click", () => {

      const distance = userPosition
        ? distanceMeters(
            userPosition.lat,
            userPosition.lng,
            place.lat,
            place.lng
          )
        : null;


      infoWindow.setContent(`
        <div style="
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
          max-width:240px
        ">

          <div style="
            font-weight:800;
            font-size:15px;
            margin-bottom:4px
          ">
            ${escapeHtml(place.name)}
          </div>

          <div style="
            font-size:12px;
            color:#6b7280;
            margin-bottom:8px
          ">
            ${escapeHtml(place.category)}
            ·
            ${formatDistance(distance)}
            <br>
            ${escapeHtml(place.address || "")}
          </div>

          <a
            href="${directionsUrl(place)}"
            target="_blank"
            rel="noopener noreferrer"
            style="
              display:inline-block;
              background:#111827;
              color:#fff;
              text-decoration:none;
              font-weight:800;
              font-size:12px;
              padding:7px 9px;
              border-radius:9px
            "
          >
            步行導航
          </a>

        </div>
      `);


      infoWindow.open({
        anchor: marker,
        map
      });

    });


    // 每建立一粒 marker，就加入 array
    restaurantMarkers.push(marker);

  });


  // =========================================================
  // 2. 完成建立所有 marker 後，先開始 clustering
  // =========================================================

  if (!restaurantMarkers.length) {
    return;
  }


  // CDN 意外載入失敗時 fallback
  if (typeof markerClusterer === "undefined") {

    restaurantMarkers.forEach(marker => {
      marker.setMap(map);
    });

    console.warn(
      "MarkerClusterer 未能載入，使用普通 markers。"
    );

    return;
  }


  // =========================================================
  // 3. Cluster 樣式
  // =========================================================

  const clusterRenderer = {

    render: ({ count, position }) => {

      return new google.maps.Marker({

        position,

        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 22,

          fillColor: "#111827",
          fillOpacity: 0.96,

          strokeColor: "#ffffff",
          strokeOpacity: 1,
          strokeWeight: 3
        },

        label: {
          text: `${count}+`,
          color: "#ffffff",
          fontSize: "13px",
          fontWeight: "800"
        },

        zIndex: 10000 + count
      });

    }

  };


  // =========================================================
  // 4. Cluster 判定距離
  // =========================================================

  const algorithm =
    new markerClusterer.SuperClusterAlgorithm({

      radius: 35,

      maxZoom: 21,

      minPoints: 2
    });


  // =========================================================
  // 5. 建立 MarkerClusterer
  // =========================================================

  restaurantClusterer =
    new markerClusterer.MarkerClusterer({

      map,

      markers: restaurantMarkers,

      algorithm,

      renderer: clusterRenderer

    });

}
    
    function renderList(items) {
      const rows = items.map(place => {
        let distance = null;

        if (userPosition && hasCoords(place)) {
          distance = distanceMeters(
            userPosition.lat,
            userPosition.lng,
            place.lat,
            place.lng
          );
        }

        return { ...place, distance };
      });

      rows.sort((a, b) => {
        if (a.distance != null && b.distance != null) return a.distance - b.distance;
        if (hasCoords(a) && !hasCoords(b)) return -1;
        if (!hasCoords(a) && hasCoords(b)) return 1;
        return 0;
      });

      sheetTitleEl.textContent = activeCategory === "全部"
        ? `全部餐廳 (${rows.length})`
        : `${activeCategory} (${rows.length})`;

      if (!geocodingDone) {
        sheetHintEl.textContent = `餐廳位置 ${geocodingCount}/${restaurants.length}`;
      } else if (userPosition) {
        sheetHintEl.textContent = "由近到遠 · 直線距離";
      } else {
        sheetHintEl.textContent = "餐廳位置已準備";
      }

      const loading = !geocodingDone
        ? `<div class="loading-note">正在用 Google 確認未有座標嘅餐廳位置…</div>`
        : "";

      resultsEl.innerHTML = loading + rows.map(place => {
        const locText = hasCoords(place)
          ? (place.distance != null ? formatDistance(place.distance) : "已定位餐廳")
          : "位置未確認";

        return `
          <div class="place-card"
               data-lat="${hasCoords(place) ? place.lat : ""}"
               data-lng="${hasCoords(place) ? place.lng : ""}">

            <div>
              <div class="place-name">${escapeHtml(place.emoji || "🍴")} ${escapeHtml(place.name)}</div>
              <div class="place-address">${escapeHtml(place.address || "")}</div>
              <div class="place-meta">
                <span>${escapeHtml(place.category)}</span>
                <span>·</span>
                <span class="distance">${locText}</span>
              </div>
            </div>

            <div class="actions">
              <a class="nav-btn"
                 href="${directionsUrl(place)}"
                 target="_blank"
                 rel="noopener noreferrer">導航 ↗</a>

              ${place.openRiceUrl ? `
  <a class="maps-btn"
     href="${escapeHtml(place.openRiceUrl)}"
     target="_blank"
     rel="noopener noreferrer">OpenRice</a>
` : ""}
            </div>
          </div>
        `;
      }).join("") + `
        <div class="footer-links">
          <a href="./privacy.html">私隱</a>
          &nbsp;·&nbsp;
          <a href="./terms.html">使用條款</a>
        </div>
      `;

      resultsEl.querySelectorAll(".place-card").forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest("a")) return;

          const latText = card.dataset.lat;
          const lngText = card.dataset.lng;
          if (!latText || !lngText || !map) return;

          const lat = Number(latText);
          const lng = Number(lngText);

          if (Number.isFinite(lat) && Number.isFinite(lng)) {
            map.panTo({ lat, lng });
            map.setZoom(Math.max(map.getZoom() || 16, 16));
          }
        });
      });
    }

    function render() {
      const items = filteredRestaurants();
      renderMarkers(items);
      renderList(items);
    }

    function fitVisibleRestaurants() {
      if (!map) return;

      const items = filteredRestaurants().filter(hasCoords);
      if (!items.length) return;

      const bounds = new google.maps.LatLngBounds();

      items.forEach(place => {
        bounds.extend({ lat: place.lat, lng: place.lng });
      });

      if (userPosition) bounds.extend(userPosition);

      if (items.length === 1 && !userPosition) {
        map.setCenter({ lat: items[0].lat, lng: items[0].lng });
        map.setZoom(16);
      } else {
        map.fitBounds(bounds, {
          top: 120,
          right: 45,
          bottom: 45,
          left: 45
        });
      }
    }

    function updateUserLocation(position) {
      if (!map) return;

      const { latitude, longitude, accuracy } = position.coords;
      userPosition = { lat: latitude, lng: longitude };

      locationStatusEl.textContent = accuracy
        ? `已定位 · ±${Math.round(accuracy)}m`
        : "已定位";

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          map,
          position: userPosition,
          title: "你而家位置",
          zIndex: 9999,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#4285F4",
            fillOpacity: 1,
            strokeColor: "#FFFFFF",
            strokeWeight: 3
          }
        });
      } else {
        userMarker.setPosition(userPosition);
      }

      if (!accuracyCircle) {
        accuracyCircle = new google.maps.Circle({
          map,
          center: userPosition,
          radius: accuracy || 0,
          strokeColor: "#4285F4",
          strokeOpacity: 0.25,
          strokeWeight: 1,
          fillColor: "#4285F4",
          fillOpacity: 0.06
        });
      } else {
        accuracyCircle.setCenter(userPosition);
        accuracyCircle.setRadius(accuracy || 0);
      }

      if (!hasCenteredOnUser) {
        map.setCenter(userPosition);
        map.setZoom(16);
        hasCenteredOnUser = true;
      }

      render();
    }

    function locationError(error) {
      const messages = {
        1: "未允許定位",
        2: "暫時搵唔到位置",
        3: "定位逾時"
      };

      locationStatusEl.textContent = messages[error.code] || "定位失敗";

      if (geocodingDone) {
        sheetHintEl.textContent = "可照常瀏覽餐廳";
      }

      if (!hasCenteredOnUser) {
        fitVisibleRestaurants();
      }
    }

    function startLocation() {
      if (!("geolocation" in navigator)) {
        locationStatusEl.textContent = "瀏覽器不支援定位";
        return;
      }

      locationStatusEl.textContent = "正在定位…";

      navigator.geolocation.watchPosition(
        updateUserLocation,
        locationError,
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 5000
        }
      );
    }

    async function geocodePlace(place) {
      const address = place.geocodeQuery || `${place.name} ${place.address || ""} 澳門`;

      try {
        const response = await geocoder.geocode({
          address,
          region: "MO",
          componentRestrictions: { country: "MO" }
        });

        const first = response.results?.[0];
        if (!first) return false;

        const loc = first.geometry.location;
        const lat = loc.lat();
        const lng = loc.lng();

        if (!isMacauCoordinate(lat, lng)) return false;

        place.lat = lat;
        place.lng = lng;
        return true;
      } catch (error) {
        console.warn("Geocode failed:", place.name, error);
        return false;
      }
    }

    function isMacauCoordinate(lat, lng) {
      return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= 22.05 && lat <= 22.25 &&
        lng >= 113.45 && lng <= 113.65
      );
    }

    async function resolveRestaurantLocations() {
      geocodingCount = restaurants.filter(hasCoords).length;
      render();

      const pending = restaurants.filter(place => !hasCoords(place));

      for (const place of pending) {
        await geocodePlace(place);
        geocodingCount = restaurants.filter(hasCoords).length;
        render();

        // 稍為分散請求，避免一次過太密集。
        await sleep(250);
      }

      geocodingDone = true;
      render();
      fitVisibleRestaurants();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    locateButtonEl.addEventListener("click", () => {
      if (userPosition && map) {
        map.setCenter(userPosition);
        map.setZoom(17);
      } else {
        startLocation();
      }
    });


    categoryToggleButtonEl.addEventListener("click", () => {
  const isExpanded =
    categoryRowEl.classList.toggle("expanded");


  categoryToggleButtonEl.setAttribute(
    "aria-expanded",
    String(isExpanded)
  );

  categoryToggleButtonEl.setAttribute(
    "aria-label",
    isExpanded
      ? "收起分類"
      : "展開所有分類"
  );
});
    
    expandMapButtonEl.addEventListener("click", () => {
  toggleBottomSheet();
});
    

    // Google Maps API authentication failure callback.
    window.gm_authFailure = function() {
      showFatal(
        "Google Maps API 驗證失敗。請檢查 <strong>config.js</strong> 入面嘅 API key、Billing、" +
        "Maps JavaScript API，以及 Website restrictions。"
      );
    };

    window.initGoogleMap = async function() {
      try {
        // Google 現時建議先載入 maps library，再建立 Map。
        // 強制用 Raster，對手機 Safari / 較舊裝置較穩定，而且毋須 Map ID。
        const { Map } = await google.maps.importLibrary("maps");
        const { Geocoder } = await google.maps.importLibrary("geocoding");

        map = new Map(document.getElementById("map"), {
  center: MACAU_CENTER,
  zoom: 14,
  mapTypeControl: false,
  fullscreenControl: false,
  streetViewControl: false,

  clickableIcons: false,

  gestureHandling: "greedy",
  isFractionalZoomEnabled: true,
  renderingType: google.maps.RenderingType.VECTOR,
          
  styles: [
    {
      featureType: "poi.business",
      stylers: [{ visibility: "off" }]
    },
    {
      featureType: "poi.attraction",
      elementType: "labels.icon",
      stylers: [{ visibility: "off" }]
    }
  ]
});
        setupOneHandZoom();
        geocoder = new Geocoder();
        infoWindow = new google.maps.InfoWindow();
        
        map.addListener("click", () => {
  infoWindow.close();
});


        // 如果底圖成功完成第一次 tiles load，就代表 Google Maps rendering 正常。
        let tilesLoaded = false;
        google.maps.event.addListenerOnce(map, "tilesloaded", () => {
          tilesLoaded = true;
          console.log("Google Maps tiles loaded");
        });

        // 如果 8 秒後仲未有 tiles，顯示較清楚提示，方便排錯。
        setTimeout(() => {
          if (!tilesLoaded) {
            console.warn("Google Maps tiles have not loaded after 8 seconds.");
          }
        }, 8000);

        makeChips();
        render();
        startLocation();
        await resolveRestaurantLocations();
      } catch (error) {
        console.error(error);
        showFatal(
          "Google Maps 啟動失敗。請檢查 API key、Billing、Maps JavaScript API，" +
          "以及 Website restrictions；之後重新整理。"
        );
      }
    };

    function loadGoogleMaps() {
      if (
        typeof MAP_CONFIG === "undefined" ||
        !MAP_CONFIG.googleMapsApiKey ||
        MAP_CONFIG.googleMapsApiKey === "PASTE_YOUR_API_KEY_HERE"
      ) {
        makeChips();
        geocodingDone = true;
        renderList(filteredRestaurants());

        showFatal(
          "你仲未填 Google Maps API key。<br><br>" +
          "打開 <strong>config.js</strong>，將 <code>PASTE_YOUR_API_KEY_HERE</code> " +
          "換成你自己嘅 key，再 Commit 去 GitHub。"
        );
        return;
      }

      const script = document.createElement("script");
      const params = new URLSearchParams({
        key: MAP_CONFIG.googleMapsApiKey,
        loading: "async",
        callback: "initGoogleMap",
        v: "weekly",
        auth_referrer_policy: "origin"
      });

      script.src = `https://maps.googleapis.com/maps/api/js?${params.toString()}`;
      script.async = true;
      script.onerror = () => {
        showFatal("載入 Google Maps 失敗。請檢查網絡或 API key 設定。");
      };

      document.head.appendChild(script);
    }

setupBottomSheet();
loadGoogleMaps();
  </script>
