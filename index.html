<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>🎂小琪 2026 生日 - 薩摩耶覓食地圖☃️📍</title>

  <style>
    :root {
      --panel: rgba(255,255,255,.97);
      --text: #171717;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --sheet-height: 36vh;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang HK", "Noto Sans HK", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: #f3f4f6;
    }

    #map-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: var(--sheet-height);
  z-index: 1;
  background: #e5e7eb;
}

#map {
  width: 100%;
  height: 100%;
}

    .topbar {
      position: fixed;
      z-index: 1000;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      pointer-events: none;
    }

    .top-card {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
      padding: 10px;
      backdrop-filter: blur(12px);
    }

    .title-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 10px;
  margin-bottom: 9px;
}

.title {
  min-width: 0;
}

.title-main {
  font-size: 17px;
  font-weight: 850;
  line-height: 1.25;
  white-space: nowrap;
}

.title-sub {
  margin-top: 2px;
  font-size: 13px;
  font-weight: 750;
  line-height: 1.25;
  color: var(--muted);
  white-space: nowrap;
}

.location-status {
  max-width: 120px;
  padding-top: 2px;
  color: var(--muted);
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 1px;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: #222;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .locate-button {
      position: fixed;
      z-index: 900;
      right: 14px;
      bottom: calc(var(--sheet-height) + 14px);
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 5px 18px rgba(0,0,0,.2);
      font-size: 22px;
      cursor: pointer;
    }

    .sheet {
      position: fixed;
      z-index: 800;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--sheet-height);
      min-height: 235px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border-top: 1px solid rgba(0,0,0,.08);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 28px rgba(0,0,0,.12);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .grabber {
      width: 38px;
      height: 5px;
      flex: 0 0 auto;
      margin: 0 auto 8px;
      border-radius: 999px;
      background: #d1d5db;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
      margin-bottom: 7px;
    }

    .sheet-title { font-size: 16px; font-weight: 850; }

    .sheet-hint {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    #results {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 28px;
    }

    .place-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 11px 4px;
      border-top: 1px solid var(--border);
    }

    .place-card:first-child { border-top: 0; }

    .place-name {
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .place-address {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .place-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .distance {
      color: #111;
      font-weight: 850;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-btn, .maps-btn {
      display: block;
      min-width: 76px;
      text-align: center;
      text-decoration: none;
      border-radius: 11px;
      padding: 8px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav-btn { background: #111827; color: #fff; }

    .maps-btn {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .loading-note, .setup-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 4px 9px;
    }

    .setup-note strong { color: #111; }

    .error-card {
      position: fixed;
      z-index: 2000;
      left: 14px;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 520px;
      margin: auto;
      padding: 18px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      font-size: 14px;
      line-height: 1.55;
    }

    .error-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .footer-links {
      padding: 8px 4px 14px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .footer-links a { color: inherit; }

    @media (min-width: 760px) {
      :root { --sheet-height: 32vh; }

      .topbar {
        left: 50%;
        right: auto;
        width: min(720px, calc(100% - 24px));
        transform: translateX(-50%);
      }

      .sheet {
        left: 50%;
        width: min(720px, 100%);
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <div id="map-container">
  <div id="map"></div>
</div>

  <div class="topbar">
    <div class="top-card">
      <div class="title-row">
  <div class="title">
    <div class="title-main">🎂 小琪 2026 生日 🎊</div>
    <div class="title-sub">☃️ 薩摩耶覓食地圖 📍</div>
  </div>

  <div id="locationStatus" class="location-status">準備定位…</div>
</div>
      <div id="chips" class="chips"></div>
    </div>
  </div>

  <button id="locateButton" class="locate-button" aria-label="返回我的位置">◎</button>

  <section class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">全部餐廳</div>
      <div id="sheetHint" class="sheet-hint">準備 Google Maps…</div>
    </div>
    <div id="results"></div>
  </section>

  <!-- 你日後通常只改 config.js / restaurants.js -->
  <script src="./config.js"></script>
  <script src="./restaurants.js"></script>

  <script>
    const MACAU_CENTER = { lat: 22.1987, lng: 113.5439 };

    let map;
    let geocoder;
    let infoWindow;
    let activeCategory = "全部";
    let restaurantMarkers = [];
    let userPosition = null;
    let userMarker = null;
    let accuracyCircle = null;
    let hasCenteredOnUser = false;
    let geocodingDone = false;
    let geocodingCount = 0;

    const chipsEl = document.getElementById("chips");
    const resultsEl = document.getElementById("results");
    const sheetTitleEl = document.getElementById("sheetTitle");
    const sheetHintEl = document.getElementById("sheetHint");
    const locationStatusEl = document.getElementById("locationStatus");
    const locateButtonEl = document.getElementById("locateButton");

    function showFatal(message) {
      const card = document.createElement("div");
      card.className = "error-card";
      card.innerHTML = `<h2>地圖未能啟動</h2><div>${message}</div>`;
      document.body.appendChild(card);
    }

    function hasCoords(place) {
      return Number.isFinite(place.lat) && Number.isFinite(place.lng);
    }

    function categoryEmoji(category) {
      const found = restaurants.find(r => r.category === category);
      return found?.emoji || "🍴";
    }

    function uniqueCategories() {
      return [...new Set(restaurants.map(r => r.category).filter(Boolean))];
    }

    function makeChips() {
      const cats = ["全部", ...uniqueCategories()];
      chipsEl.innerHTML = "";

      cats.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "chip" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat === "全部"
          ? "🗺️ 全部"
          : `${categoryEmoji(cat)} ${cat}`;

        btn.addEventListener("click", () => {
          activeCategory = cat;
          makeChips();
          render();
          fitVisibleRestaurants();
        });

        chipsEl.appendChild(btn);
      });
    }

    function filteredRestaurants() {
      if (activeCategory === "全部") return [...restaurants];
      return restaurants.filter(r => r.category === activeCategory);
    }

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;

      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(meters) {
      if (meters == null) return "待定位";
      if (meters < 1000) return `${Math.round(meters)} m`;
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function directionsUrl(place) {
      if (!hasCoords(place)) return place.mapsUrl || "#";
      const dest = encodeURIComponent(`${place.lat},${place.lng}`);
      return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
    }

    function clearRestaurantMarkers() {
      restaurantMarkers.forEach(marker => marker.setMap(null));
      restaurantMarkers = [];
    }

    function renderMarkers(items) {
      if (!map) return;

      clearRestaurantMarkers();

      items.filter(hasCoords).forEach(place => {
       const marker = new google.maps.Marker({
  map,
  position: { lat: place.lat, lng: place.lng },
  title: place.name,

  icon: {
    path: google.maps.SymbolPath.CIRCLE,
    scale: 18,
    fillColor: "#e3c5f2",
    fillOpacity: 0.98,
    strokeColor: "#ce85f2",
    strokeOpacity: 1,
    strokeWeight: 2
  },

  label: {
    text: place.emoji || "🍴",
    fontSize: "18px"
  },

  zIndex: 10
});

        marker.addListener("click", () => {
          const distance = userPosition
            ? distanceMeters(userPosition.lat, userPosition.lng, place.lat, place.lng)
            : null;

          infoWindow.setContent(`
            <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:240px">
              <div style="font-weight:800;font-size:15px;margin-bottom:4px">${escapeHtml(place.name)}</div>
              <div style="font-size:12px;color:#6b7280;margin-bottom:8px">
                ${escapeHtml(place.category)} · ${formatDistance(distance)}<br>
                ${escapeHtml(place.address || "")}
              </div>
              <a href="${directionsUrl(place)}"
                 target="_blank"
                 rel="noopener noreferrer"
                 style="display:inline-block;background:#111827;color:#fff;text-decoration:none;font-weight:800;font-size:12px;padding:7px 9px;border-radius:9px">
                 步行導航
              </a>
            </div>
          `);

          infoWindow.open({ anchor: marker, map });
        });

        restaurantMarkers.push(marker);
      });
    }

    function renderList(items) {
      const rows = items.map(place => {
        let distance = null;

        if (userPosition && hasCoords(place)) {
          distance = distanceMeters(
            userPosition.lat,
            userPosition.lng,
            place.lat,
            place.lng
          );
        }

        return { ...place, distance };
      });

      rows.sort((a, b) => {
        if (a.distance != null && b.distance != null) return a.distance - b.distance;
        if (hasCoords(a) && !hasCoords(b)) return -1;
        if (!hasCoords(a) && hasCoords(b)) return 1;
        return 0;
      });

      sheetTitleEl.textContent = activeCategory === "全部"
        ? `全部餐廳 (${rows.length})`
        : `${activeCategory} (${rows.length})`;

      if (!geocodingDone) {
        sheetHintEl.textContent = `餐廳位置 ${geocodingCount}/${restaurants.length}`;
      } else if (userPosition) {
        sheetHintEl.textContent = "由近到遠 · 直線距離";
      } else {
        sheetHintEl.textContent = "餐廳位置已準備";
      }

      const loading = !geocodingDone
        ? `<div class="loading-note">正在用 Google 確認未有座標嘅餐廳位置…</div>`
        : "";

      resultsEl.innerHTML = loading + rows.map(place => {
        const locText = hasCoords(place)
          ? (place.distance != null ? formatDistance(place.distance) : "已定位餐廳")
          : "位置未確認";

        return `
          <div class="place-card"
               data-lat="${hasCoords(place) ? place.lat : ""}"
               data-lng="${hasCoords(place) ? place.lng : ""}">

            <div>
              <div class="place-name">${escapeHtml(place.emoji || "🍴")} ${escapeHtml(place.name)}</div>
              <div class="place-address">${escapeHtml(place.address || "")}</div>
              <div class="place-meta">
                <span>${escapeHtml(place.category)}</span>
                <span>·</span>
                <span class="distance">${locText}</span>
              </div>
            </div>

            <div class="actions">
              <a class="nav-btn"
                 href="${directionsUrl(place)}"
                 target="_blank"
                 rel="noopener noreferrer">導航 ↗</a>

              ${place.openRiceUrl ? `
  <a class="maps-btn"
     href="${escapeHtml(place.openRiceUrl)}"
     target="_blank"
     rel="noopener noreferrer">OpenRice</a>
` : ""}
            </div>
          </div>
        `;
      }).join("") + `
        <div class="footer-links">
          <a href="./privacy.html">私隱</a>
          &nbsp;·&nbsp;
          <a href="./terms.html">使用條款</a>
        </div>
      `;

      resultsEl.querySelectorAll(".place-card").forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest("a")) return;

          const latText = card.dataset.lat;
          const lngText = card.dataset.lng;
          if (!latText || !lngText || !map) return;

          const lat = Number(latText);
          const lng = Number(lngText);

          if (Number.isFinite(lat) && Number.isFinite(lng)) {
            map.panTo({ lat, lng });
            map.setZoom(Math.max(map.getZoom() || 16, 16));
          }
        });
      });
    }

    function render() {
      const items = filteredRestaurants();
      renderMarkers(items);
      renderList(items);
    }

    function fitVisibleRestaurants() {
      if (!map) return;

      const items = filteredRestaurants().filter(hasCoords);
      if (!items.length) return;

      const bounds = new google.maps.LatLngBounds();

      items.forEach(place => {
        bounds.extend({ lat: place.lat, lng: place.lng });
      });

      if (userPosition) bounds.extend(userPosition);

      if (items.length === 1 && !userPosition) {
        map.setCenter({ lat: items[0].lat, lng: items[0].lng });
        map.setZoom(16);
      } else {
        map.fitBounds(bounds, {
          top: 120,
          right: 45,
          bottom: 45,
          left: 45
        });
      }
    }

    function updateUserLocation(position) {
      if (!map) return;

      const { latitude, longitude, accuracy } = position.coords;
      userPosition = { lat: latitude, lng: longitude };

      locationStatusEl.textContent = accuracy
        ? `已定位 · ±${Math.round(accuracy)}m`
        : "已定位";

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          map,
          position: userPosition,
          title: "你而家位置",
          zIndex: 9999,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#4285F4",
            fillOpacity: 1,
            strokeColor: "#FFFFFF",
            strokeWeight: 3
          }
        });
      } else {
        userMarker.setPosition(userPosition);
      }

      if (!accuracyCircle) {
        accuracyCircle = new google.maps.Circle({
          map,
          center: userPosition,
          radius: accuracy || 0,
          strokeColor: "#4285F4",
          strokeOpacity: 0.25,
          strokeWeight: 1,
          fillColor: "#4285F4",
          fillOpacity: 0.06
        });
      } else {
        accuracyCircle.setCenter(userPosition);
        accuracyCircle.setRadius(accuracy || 0);
      }

      if (!hasCenteredOnUser) {
        map.setCenter(userPosition);
        map.setZoom(16);
        hasCenteredOnUser = true;
      }

      render();
    }

    function locationError(error) {
      const messages = {
        1: "未允許定位",
        2: "暫時搵唔到位置",
        3: "定位逾時"
      };

      locationStatusEl.textContent = messages[error.code] || "定位失敗";

      if (geocodingDone) {
        sheetHintEl.textContent = "可照常瀏覽餐廳";
      }

      if (!hasCenteredOnUser) {
        fitVisibleRestaurants();
      }
    }

    function startLocation() {
      if (!("geolocation" in navigator)) {
        locationStatusEl.textContent = "瀏覽器不支援定位";
        return;
      }

      locationStatusEl.textContent = "正在定位…";

      navigator.geolocation.watchPosition(
        updateUserLocation,
        locationError,
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 5000
        }
      );
    }

    async function geocodePlace(place) {
      const address = place.geocodeQuery || `${place.name} ${place.address || ""} 澳門`;

      try {
        const response = await geocoder.geocode({
          address,
          region: "MO",
          componentRestrictions: { country: "MO" }
        });

        const first = response.results?.[0];
        if (!first) return false;

        const loc = first.geometry.location;
        const lat = loc.lat();
        const lng = loc.lng();

        if (!isMacauCoordinate(lat, lng)) return false;

        place.lat = lat;
        place.lng = lng;
        return true;
      } catch (error) {
        console.warn("Geocode failed:", place.name, error);
        return false;
      }
    }

    function isMacauCoordinate(lat, lng) {
      return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= 22.05 && lat <= 22.25 &&
        lng >= 113.45 && lng <= 113.65
      );
    }

    async function resolveRestaurantLocations() {
      geocodingCount = restaurants.filter(hasCoords).length;
      render();

      const pending = restaurants.filter(place => !hasCoords(place));

      for (const place of pending) {
        await geocodePlace(place);
        geocodingCount = restaurants.filter(hasCoords).length;
        render();

        // 稍為分散請求，避免一次過太密集。
        await sleep(250);
      }

      geocodingDone = true;
      render();
      fitVisibleRestaurants();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    locateButtonEl.addEventListener("click", () => {
      if (userPosition && map) {
        map.setCenter(userPosition);
        map.setZoom(17);
      } else {
        startLocation();
      }
    });

    // Google Maps API authentication failure callback.
    window.gm_authFailure = function() {
      showFatal(
        "Google Maps API 驗證失敗。請檢查 <strong>config.js</strong> 入面嘅 API key、Billing、" +
        "Maps JavaScript API，以及 Website restrictions。"
      );
    };

    window.initGoogleMap = async function() {
      try {
        // Google 現時建議先載入 maps library，再建立 Map。
        // 強制用 Raster，對手機 Safari / 較舊裝置較穩定，而且毋須 Map ID。
        const { Map } = await google.maps.importLibrary("maps");
        const { Geocoder } = await google.maps.importLibrary("geocoding");

        map = new Map(document.getElementById("map"), {
  center: MACAU_CENTER,
  zoom: 14,
  mapTypeControl: false,
  fullscreenControl: false,
  streetViewControl: false,

  clickableIcons: false,

  gestureHandling: "greedy",
  renderingType: google.maps.RenderingType.RASTER,

  styles: [
    {
      featureType: "poi.business",
      stylers: [{ visibility: "off" }]
    },
    {
      featureType: "poi.attraction",
      elementType: "labels.icon",
      stylers: [{ visibility: "off" }]
    }
  ]
});
        geocoder = new Geocoder();
        infoWindow = new google.maps.InfoWindow();

        // 如果底圖成功完成第一次 tiles load，就代表 Google Maps rendering 正常。
        let tilesLoaded = false;
        google.maps.event.addListenerOnce(map, "tilesloaded", () => {
          tilesLoaded = true;
          console.log("Google Maps tiles loaded");
        });

        // 如果 8 秒後仲未有 tiles，顯示較清楚提示，方便排錯。
        setTimeout(() => {
          if (!tilesLoaded) {
            console.warn("Google Maps tiles have not loaded after 8 seconds.");
          }
        }, 8000);

        makeChips();
        render();
        startLocation();
        await resolveRestaurantLocations();
      } catch (error) {
        console.error(error);
        showFatal(
          "Google Maps 啟動失敗。請檢查 API key、Billing、Maps JavaScript API，" +
          "以及 Website restrictions；之後重新整理。"
        );
      }
    };

    function loadGoogleMaps() {
      if (
        typeof MAP_CONFIG === "undefined" ||
        !MAP_CONFIG.googleMapsApiKey ||
        MAP_CONFIG.googleMapsApiKey === "PASTE_YOUR_API_KEY_HERE"
      ) {
        makeChips();
        geocodingDone = true;
        renderList(filteredRestaurants());

        showFatal(
          "你仲未填 Google Maps API key。<br><br>" +
          "打開 <strong>config.js</strong>，將 <code>PASTE_YOUR_API_KEY_HERE</code> " +
          "換成你自己嘅 key，再 Commit 去 GitHub。"
        );
        return;
      }

      const script = document.createElement("script");
      const params = new URLSearchParams({
        key: MAP_CONFIG.googleMapsApiKey,
        loading: "async",
        callback: "initGoogleMap",
        v: "weekly",
        auth_referrer_policy: "origin"
      });

      script.src = `https://maps.googleapis.com/maps/api/js?${params.toString()}`;
      script.async = true;
      script.onerror = () => {
        showFatal("載入 Google Maps 失敗。請檢查網絡或 API key 設定。");
      };

      document.head.appendChild(script);
    }

    loadGoogleMaps();
  </script>
</body>
</html>
