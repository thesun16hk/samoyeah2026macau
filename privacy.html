  <h1>私隱政策</h1>
  <p>呢個網站係私人旅行用嘅餐廳地圖。網站本身冇帳戶系統，亦唔會將你嘅即時 GPS 位置儲存喺本站伺服器。</p>
  <p>如果你允許瀏覽器定位，位置只會喺你部裝置上用來顯示自己位置同計算你與餐廳之間嘅距離。</p>
  <p>本網站使用 Google Maps Platform 顯示地圖及將部分餐廳地址轉成地圖位置。使用時，瀏覽器會向 Google 服務發出必要請求；Google 對相關資料嘅處理受 Google Privacy Policy 約束。</p>
